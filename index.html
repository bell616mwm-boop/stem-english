<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#e6ebf4">
<title>STEM English — Physics Cards</title>
<style>
  :root{
    --bg:#e6ebf4; --ink:#1e2a3f; --sub:#52657f; --faint:#93a5bd;
    --glass:#f8fafc; --glass2:#ffffff;
    --line:rgba(63,88,130,.38);
    --accent:#1d6fb8; --accent-d:#185a96; --orange:#e8930c;
    --good:#3d7a44; --bad:#b0402f;
    --serif:Georgia,"Times New Roman","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Noto Serif KR","Noto Serif SC","Noto Serif TC",serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; overflow:hidden;}
  body{
    margin:0; color:var(--ink);
    font-family:"Avenir Next","Segoe UI",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Noto Sans KR","Noto Sans SC","Noto Sans TC","Yu Gothic UI",sans-serif;
    background:
      radial-gradient(1100px 600px at 85% -10%, rgba(252,211,141,.38), transparent 60%),
      radial-gradient(900px 550px at -10% 15%, rgba(147,178,228,.55), transparent 60%),
      radial-gradient(700px 500px at 55% 115%, rgba(163,181,210,.45), transparent 60%),
      var(--bg);
    background-attachment:fixed;
  }
  .app{height:100dvh; max-height:100dvh; display:flex; flex-direction:column; max-width:880px; margin:0 auto; padding:0 16px;}
  .appbar{display:flex; align-items:center; gap:10px; padding:calc(12px + env(safe-area-inset-top)) 2px 10px; flex:0 0 auto;}
  .logo{width:38px; height:38px; border-radius:11px; display:grid; place-items:center; font-size:19px;
    background:linear-gradient(135deg,#fbbf24,var(--orange) 55%,#ea580c); box-shadow:0 6px 18px rgba(217,119,6,.35);}
  .brand-name{font-size:11px; letter-spacing:.22em; color:var(--sub); font-weight:700;}
  .appbar h1{font-family:var(--serif); font-size:19px; margin:1px 0 0; line-height:1.15;}
  .appbar .total{margin-left:auto; text-align:right; font-size:12px; color:var(--sub); line-height:1.45;}
  .appbar .total b{color:var(--ink); font-size:14px;}
  .views{flex:1 1 auto; min-height:0; position:relative;}
  .view{position:absolute; inset:0; overflow-y:auto; display:none; padding:4px 2px 18px; scrollbar-width:thin;}
  .view.active{display:block;}
  .view.study{overflow:hidden; display:none;}
  .view.study.active{display:flex; flex-direction:column;}
  h2.sec{font-family:var(--serif); font-size:21px; margin:18px 0 4px;}
  .sec-sub{color:var(--sub); font-size:13px; margin:0 0 14px; line-height:1.6;}
  /* language selector */
  .lang-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:2px 0 14px;}
  .lang-row .lbl{font-size:13px; color:var(--sub); font-weight:700; margin-right:2px;}
  .lang-chip{border:1.5px solid var(--line); background:var(--glass); color:var(--sub); border-radius:999px;
    padding:8px 14px; font-size:13.5px; cursor:pointer; box-shadow:0 3px 10px rgba(50,70,110,.10);}
  .lang-chip.active{background:#e8f1fb; color:var(--ink); border-color:var(--accent); font-weight:800;}
  /* home */
  .hero{background:linear-gradient(150deg,#ffffff,#e2eaf6); border:1.5px solid var(--line); border-radius:22px;
    box-shadow:0 18px 40px rgba(50,70,110,.20); padding:18px; display:flex; gap:18px; align-items:center;}
  .ring{width:92px; height:92px; flex:0 0 auto;}
  .ring circle{fill:none; stroke-width:8.5; stroke-linecap:round;}
  .ring .track{stroke:rgba(63,88,130,.16);}
  .ring .val{stroke:url(#ringGrad); transform:rotate(-90deg); transform-origin:center; transition:stroke-dashoffset .5s ease;}
  .ring text{fill:var(--ink); font-size:20px; font-weight:800; text-anchor:middle;}
  .hero .big{font-size:18px; font-weight:800;}
  .hero .small{color:var(--sub); font-size:13px; margin-top:4px; line-height:1.6;}
  .cta{margin-top:14px; width:100%; border:none; cursor:pointer; border-radius:16px; padding:15px;
    background:linear-gradient(135deg,#2f83c5,var(--accent-d)); color:#fff; font-size:16px; font-weight:800;
    box-shadow:0 10px 24px rgba(29,111,184,.35);}
  .cta:active{transform:scale(.98);}
  .subj-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px;}
  @media (max-width:520px){ .subj-grid{grid-template-columns:1fr;} }
  .subj{background:var(--glass); border:1.5px solid var(--line); border-radius:18px; padding:15px 16px; cursor:pointer;
    box-shadow:0 6px 18px rgba(50,70,110,.13); text-align:left; width:100%; color:var(--ink);}
  .subj:hover{background:var(--glass2);}
  .subj .nm{font-family:var(--serif); font-size:17px; font-weight:700;}
  .subj .ds{color:var(--sub); font-size:12.5px; margin-top:3px;}
  .subj .bar{height:7px; border-radius:99px; background:rgba(63,88,130,.15); margin-top:11px; overflow:hidden;}
  .subj .bar i{display:block; height:100%; background:linear-gradient(90deg,var(--orange),var(--accent)); border-radius:99px;}
  .subj .pt{font-size:12px; color:var(--sub); margin-top:6px;}
  .subj.off{opacity:.55; cursor:default;}
  .subj.off:hover{background:var(--glass);}
  .badge{display:inline-block; font-size:11px; font-weight:700; color:#1e5aa8; border:1px solid rgba(37,99,235,.45);
    background:rgba(59,130,246,.12); border-radius:999px; padding:1px 9px; margin-left:8px; vertical-align:2px;}
  .badge.soon{color:var(--sub); border-color:var(--line); background:rgba(120,140,170,.10);}
  /* subjects */
  .opt-row{display:flex; gap:8px; margin:2px 0 14px;}
  .opt{flex:1; border:1.5px solid var(--line); background:var(--glass); color:var(--sub);
    padding:10px 8px; border-radius:12px; font-size:13.5px; cursor:pointer; box-shadow:0 4px 12px rgba(50,70,110,.10);}
  .opt.on{color:var(--ink); border-color:var(--accent); background:#e8f1fb; font-weight:700;}
  .chap-row{display:flex; align-items:center; gap:14px; width:100%; text-align:left; cursor:pointer; color:var(--ink);
    background:var(--glass); border:1.5px solid var(--line); border-radius:16px; padding:14px 16px; margin-bottom:10px;
    box-shadow:0 6px 16px rgba(50,70,110,.12);}
  .chap-row:hover{background:var(--glass2);}
  .chap-row .nm{font-family:var(--serif); font-size:16.5px; font-weight:700;}
  .chap-row .ds{color:var(--sub); font-size:12.5px; margin-top:2px;}
  .chap-row .bar{height:6px; border-radius:99px; background:rgba(63,88,130,.15); margin-top:9px; overflow:hidden; max-width:340px;}
  .chap-row .bar i{display:block; height:100%; background:linear-gradient(90deg,var(--orange),var(--accent));}
  .chap-row .go{margin-left:auto; color:var(--accent); font-size:20px; flex:0 0 auto;}
  /* study */
  .study-head{display:flex; align-items:center; gap:10px; padding:2px 0 10px; flex:0 0 auto;}
  .back{border:1.5px solid var(--line); background:var(--glass); color:var(--ink); border-radius:11px;
    padding:8px 13px; font-size:14px; cursor:pointer; box-shadow:0 4px 12px rgba(50,70,110,.12);}
  .study-head .ttl{font-family:var(--serif); font-weight:700; font-size:16.5px;}
  .study-head .cnt{margin-left:auto; color:var(--sub); font-size:13px; letter-spacing:.1em;}
  .scene{position:relative; flex:1 1 auto; min-height:300px; width:100%; max-width:640px; margin:0 auto; perspective:1400px;}
  .card{position:absolute; inset:0; margin:auto; width:100%; height:100%; max-height:560px; transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.2,.7,.3,1.05); cursor:pointer;}
  .card.flipped{transform:rotateY(180deg);}
  @media (prefers-reduced-motion:reduce){ .card{transition:none;} }
  .face{position:absolute; inset:0; overflow:hidden; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius:26px; padding:clamp(18px,4vw,34px);
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    background:linear-gradient(160deg,#ffffff,#e2eaf6); border:1.5px solid rgba(63,88,130,.45);
    box-shadow:0 26px 55px rgba(50,70,110,.30), 0 4px 14px rgba(50,70,110,.16), inset 0 1px 0 rgba(255,255,255,.9);}
  .face.back{transform:rotateY(180deg); background:linear-gradient(160deg,#dfeafb,#b7cff0); border-color:rgba(30,80,160,.55);}
  /* answer-side photo background (v20): rich image under a readability scrim */
  .face-bg{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .face-scrim{position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(240,246,254,.95), rgba(224,235,250,.88) 55%, rgba(208,226,248,.80));}
  body.dark .face-scrim{background:linear-gradient(180deg, rgba(9,16,32,.90), rgba(12,22,44,.85) 55%, rgba(9,18,38,.80));}
  .back-inner{position:relative; z-index:1; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;}
  .visual.on-back{margin-top:16px;}
  /* quiz answer banner (v20) */
  .qvis{position:relative; margin-top:12px; height:138px; border-radius:18px; overflow:hidden;
    border:1.5px solid rgba(63,88,130,.4); box-shadow:0 12px 26px rgba(50,70,110,.22);
    background:linear-gradient(150deg,#dbe7f8,#aecbf2);}
  .qvis img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .qvis-scrim{position:absolute; inset:0; display:flex; align-items:flex-end; justify-content:center; padding:10px;
    background:linear-gradient(180deg, rgba(240,246,255,0) 40%, rgba(240,246,255,.45));}
  .qvis .vf{font-family:var(--serif); font-style:italic; font-size:16px; color:#16345e;
    background:rgba(255,255,255,.85); border:1.5px solid rgba(63,88,130,.35); padding:5px 13px; border-radius:999px;}
  body.dark .qvis .vf{background:rgba(16,26,48,.82); color:#dbe8fb;}
  .ch-tag{font-size:12px; font-weight:700; letter-spacing:.08em; color:#1e5aa8;
    border:1px solid rgba(37,99,235,.45); background:rgba(59,130,246,.13); border-radius:999px; padding:4px 12px; margin-bottom:16px;
    box-shadow:0 2px 8px rgba(37,99,235,.18);}
  .term{font-family:var(--serif); font-size:clamp(29px,7vw,44px); font-weight:700; line-height:1.22; word-break:break-word;}
  .hint{margin-top:18px; color:var(--sub); font-size:13px;}
  .jp{font-family:var(--serif); font-size:clamp(25px,6vw,36px); font-weight:700; line-height:1.3; color:#16345e;}
  .note{margin-top:13px; color:#2c435f; font-size:clamp(14.5px,2.6vw,16.5px); line-height:1.7; max-width:44ch;}
  .en-small{margin-top:15px; color:#5b7ba6; font-size:14px; letter-spacing:.04em;}
  .known-badge{margin-top:8px; font-size:12.5px; color:var(--good); min-height:1em;}
  .actions{display:flex; gap:10px; width:100%; max-width:640px; margin:12px auto 0; flex:0 0 auto;}
  .btn{flex:1; padding:15px 10px; border-radius:16px; border:1.5px solid var(--line);
    font-size:16px; font-weight:800; cursor:pointer; color:var(--ink); box-shadow:0 7px 20px rgba(50,70,110,.18);}
  .btn:active{transform:scale(.97);}
  .btn.bad{background:linear-gradient(160deg,#f5e3e0,#faf0ee); border-color:rgba(176,64,47,.42); color:#9c3626;}
  .btn.good{background:linear-gradient(160deg,#e0efe2,#f0f7f0); border-color:rgba(61,122,68,.45); color:#2f6234;}
  .navrow{display:flex; gap:10px; width:100%; max-width:640px; margin:10px auto 2px; flex:0 0 auto;}
  .btn.navb{flex:1; background:var(--glass); font-size:14px; font-weight:600; padding:11px;}
  .done-msg{display:none; position:absolute; inset:0; height:fit-content; margin:auto; text-align:center; padding:30px 10px;}
  .done-msg .big{font-size:22px; font-weight:800; margin-bottom:8px;}
  .done-msg p{color:var(--sub); font-size:14px; line-height:1.7;}
  @media (max-height:640px){
    .btn{padding:12px 8px;} .btn.navb{padding:9px;} .navrow{margin-top:8px;}
    .appbar{padding-top:calc(8px + env(safe-area-inset-top)); padding-bottom:6px;}
    .scene{min-height:210px;}
  }
  @media (max-height:540px){ .navrow{display:none;} .scene{min-height:150px;} }
  /* wordbook & search */
  .filter-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;}
  .fchip{border:1.5px solid var(--line); background:var(--glass); color:var(--sub); border-radius:999px;
    padding:7px 13px; font-size:13px; cursor:pointer;}
  .fchip.active{background:#e8f1fb; color:var(--ink); border-color:var(--accent); font-weight:700;}
  .witem{display:flex; align-items:center; gap:12px; width:100%; text-align:left; cursor:pointer; color:var(--ink);
    background:var(--glass); border:1px solid var(--line); border-radius:14px; padding:11px 14px; margin-bottom:8px;
    box-shadow:0 3px 10px rgba(50,70,110,.08);}
  .witem:hover{background:var(--glass2);}
  .witem .en{font-family:var(--serif); font-size:16.5px; font-weight:700;}
  .wipa{font-family:var(--serif); font-weight:400; color:var(--faint); font-size:12.5px; margin-left:6px;}
  .ipa-row{display:inline-flex; align-items:center; gap:8px; margin-top:7px; cursor:pointer;
    background:rgba(255,255,255,.55); border:1.5px solid rgba(63,88,130,.28); border-radius:999px; padding:5px 14px;
    font-family:var(--serif); color:#33527a; font-size:clamp(14px,3.2vw,17px); letter-spacing:.02em;}
  .ipa-row:active{transform:scale(.97);}
  body.dark .ipa-row{background:rgba(20,32,56,.55); color:#c3d4ee; border-color:rgba(140,170,220,.4);}
  .qcard .ipa-row{margin-top:12px;}
  .witem .jp2{color:var(--sub); font-size:13px; margin-top:1px;}
  .witem .st{margin-left:auto; flex:0 0 auto; font-size:12px; font-weight:700; border-radius:999px; padding:4px 11px; border:1px solid;}
  .st.ok{color:#2f6234; border-color:rgba(61,122,68,.5); background:rgba(61,122,68,.10);}
  .st.ng{color:#9c3626; border-color:rgba(176,64,47,.4); background:rgba(176,64,47,.07);}
  .grp{font-size:12px; letter-spacing:.14em; color:var(--faint); font-weight:700; margin:16px 2px 8px;}
  .searchbox{width:100%; border:1.5px solid var(--line); border-radius:14px; background:var(--glass2);
    padding:13px 15px; font-size:16px; color:var(--ink); outline:none; box-shadow:0 4px 12px rgba(50,70,110,.10);}
  .searchbox:focus{border-color:var(--accent);}
  .empty{color:var(--sub); text-align:center; padding:28px 10px; font-size:14px; line-height:1.7;}
  /* tab bar */
  .tabbar{flex:0 0 auto; display:flex; gap:4px; border-top:1px solid var(--line);
    padding:8px 16px calc(8px + env(safe-area-inset-bottom)); background:rgba(248,250,252,.85); backdrop-filter:blur(8px); margin:0 -16px;}
  .tab{flex:1; border:none; background:none; cursor:pointer; color:var(--sub);
    font-size:11.5px; font-weight:600; padding:6px 2px; border-radius:12px; display:flex; flex-direction:column; align-items:center; gap:3px;}
  .tab .ic{font-size:20px; line-height:1;}
  .tab.active{color:var(--accent-d); background:rgba(59,130,246,.10);}
  /* ---------- settings ---------- */
  .set-group{background:var(--glass); border:1.5px solid var(--line); border-radius:18px; padding:6px 16px 12px;
    box-shadow:0 6px 18px rgba(50,70,110,.12); margin-bottom:14px;}
  .set-group .gt{font-size:12px; letter-spacing:.16em; color:var(--faint); font-weight:700; margin:12px 0 10px;}
  .set-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid rgba(120,140,170,.18);}
  .set-row:first-of-type{border-top:none;}
  .set-row .lb{font-size:14.5px; font-weight:600;}
  .set-row .ctl{margin-left:auto; display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;}
  .set-chip{border:1.5px solid var(--line); background:var(--glass2); color:var(--sub); border-radius:999px;
    padding:7px 13px; font-size:13px; cursor:pointer;}
  .set-chip.active{background:#e8f1fb; color:var(--ink); border-color:var(--accent); font-weight:800;}
  .danger{border:1.5px solid rgba(176,64,47,.5); background:rgba(176,64,47,.08); color:#9c3626;
    border-radius:12px; padding:10px 16px; font-size:14px; font-weight:700; cursor:pointer;}
  .about-txt{color:var(--sub); font-size:13px; line-height:1.8;}
  /* font sizes */
  body.fs-s .term{font-size:clamp(25px,6vw,36px);} body.fs-s .jp{font-size:clamp(21px,5vw,30px);} body.fs-s .note{font-size:13.5px;}
  body.fs-l .term{font-size:clamp(34px,8.4vw,54px);} body.fs-l .jp{font-size:clamp(30px,7vw,44px);} body.fs-l .note{font-size:clamp(16px,3vw,18.5px);}
  body.noanim .card{transition:none;}
  /* dark theme */
  body.dark{--bg:#0c1322; --ink:#e8eefb; --sub:#9db0cc; --faint:#647d9f;
    --glass:#141f38; --glass2:#1a2745; --line:rgba(140,170,220,.38);
    background:
      radial-gradient(1100px 600px at 85% -10%, rgba(217,119,6,.16), transparent 60%),
      radial-gradient(900px 550px at -10% 15%, rgba(59,110,200,.28), transparent 60%),
      radial-gradient(700px 500px at 55% 115%, rgba(70,90,140,.25), transparent 60%),
      var(--bg);}
  body.dark .hero{background:linear-gradient(150deg,#1d2a47,#131e35);}
  body.dark .face{background:linear-gradient(160deg,#1d2a47,#131e35); border-color:rgba(140,170,220,.45);}
  body.dark .face.back{background:linear-gradient(160deg,#274a7d,#1a335c); border-color:rgba(147,197,253,.55);}
  body.dark .face.back .jp{color:#e3efff;}
  body.dark .face.back .note{color:#c3d4ee;}
  body.dark .face.back .en-small{color:#8fb0dd;}
  body.dark .btn.bad{background:linear-gradient(160deg,#3a2320,#2a1a17); color:#f0a294;}
  body.dark .btn.good{background:linear-gradient(160deg,#1e3320,#152316); color:#9fd3a8;}
  body.dark .tabbar{background:rgba(14,22,40,.9);}
  body.dark .opt.on, body.dark .fchip.active, body.dark .lang-chip.active, body.dark .set-chip.active{background:#1d3355;}
  body.dark .st.ok{background:rgba(61,122,68,.25);} body.dark .st.ng{background:rgba(176,64,47,.22);}
  /* ---------- test & progress ---------- */
  .qcard{background:linear-gradient(160deg,#ffffff,#e2eaf6); border:1.5px solid rgba(63,88,130,.45); border-radius:22px;
    box-shadow:0 18px 40px rgba(50,70,110,.22); padding:26px 20px; text-align:center; margin-bottom:14px;}
  body.dark .qcard{background:linear-gradient(160deg,#1d2a47,#131e35);}
  .qprompt{font-family:var(--serif); font-size:clamp(24px,6vw,36px); font-weight:700; line-height:1.3; word-break:break-word;}
  .qhint{color:var(--sub); font-size:13px; margin-top:8px;}
  .choice{display:block; width:100%; text-align:left; cursor:pointer; color:var(--ink);
    background:var(--glass); border:1.5px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:9px;
    font-size:16px; box-shadow:0 4px 12px rgba(50,70,110,.10);}
  .choice:hover{background:var(--glass2);}
  .choice.right{background:#e0efe2; border-color:rgba(61,122,68,.6); color:#2f6234; font-weight:700;}
  .choice.wrong{background:#f5e3e0; border-color:rgba(176,64,47,.55); color:#9c3626;}
  .choice:disabled{cursor:default; opacity:.92;}
  body.dark .choice.right{background:#1e3320; color:#9fd3a8;}
  body.dark .choice.wrong{background:#3a2320; color:#f0a294;}
  .qfeedback{min-height:26px; text-align:center; font-size:15px; font-weight:700; margin:10px 0 4px;}
  .qfeedback.ok{color:var(--good);} .qfeedback.ng{color:var(--bad);}
  .stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px;}
  .stat-cell{background:var(--glass); border:1.5px solid var(--line); border-radius:16px; padding:13px 8px; text-align:center;
    box-shadow:0 5px 14px rgba(50,70,110,.11);}
  .stat-cell .v{font-size:21px; font-weight:800;}
  .stat-cell .k{color:var(--sub); font-size:11.5px; margin-top:2px;}
  .log-row{display:flex; gap:10px; align-items:center; background:var(--glass); border:1px solid var(--line);
    border-radius:12px; padding:10px 14px; margin-bottom:8px; font-size:13.5px;}
  .log-row .sc{margin-left:auto; font-weight:800;}
  .log-row .dt{color:var(--sub); font-size:12px;}
  .score-big{font-family:var(--serif); font-size:44px; font-weight:800;}
  /* ---------- quit-guard modal ---------- */
  .modal-ov{position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center;
    background:rgba(18,28,48,.52); backdrop-filter:blur(3px); padding:22px; animation:fadeIn .18s ease;}
  @keyframes fadeIn{from{opacity:0;}}
  .modal-card{background:linear-gradient(160deg,#ffffff,#e6edf8); border:1.5px solid rgba(63,88,130,.45); border-radius:22px;
    box-shadow:0 26px 55px rgba(20,35,65,.4); padding:24px 22px; max-width:400px; width:100%; text-align:center;
    animation:modalPop .28s cubic-bezier(.2,.9,.3,1.3);}
  @keyframes modalPop{from{opacity:0; transform:scale(.9) translateY(10px);}}
  body.dark .modal-card{background:linear-gradient(160deg,#1d2a47,#131e35); border-color:rgba(140,170,220,.45);}
  .modal-ttl{font-family:var(--serif); font-size:20px; font-weight:800;}
  .modal-msg{color:var(--sub); font-size:14.5px; line-height:1.75; margin:12px 0 20px;}
  .modal-leave{margin-top:10px; width:100%; padding:13px; border-radius:14px; cursor:pointer;
    border:1.5px solid rgba(176,64,47,.5); background:rgba(176,64,47,.08); color:#9c3626; font-size:15px; font-weight:700;}
  .modal-leave:active{transform:scale(.97);}
  body.dark .modal-leave{color:#f0a294;}
  /* ---------- term visuals ---------- */
  .visual{display:flex; align-items:center; justify-content:center; gap:12px; margin-top:18px; flex-wrap:wrap;}
  .visual .vic{width:60px; height:60px; flex:0 0 auto; color:#2f6fb4;
    background:rgba(47,111,180,.08); border:1.5px solid rgba(47,111,180,.28); border-radius:16px;
    display:flex; align-items:center; justify-content:center;}
  .visual .vic svg{width:46px; height:46px;}
  .visual .vf{font-family:var(--serif); font-style:italic; font-size:clamp(15px,3.4vw,18.5px); color:#33527a;
    background:rgba(255,255,255,.65); border:1.5px solid rgba(63,88,130,.32); padding:6px 14px; border-radius:999px;}
  .qcard .visual{margin-top:14px;}
  body.dark .visual .vic{color:#8fb0dd; background:rgba(90,140,210,.12); border-color:rgba(140,170,220,.4);}
  body.dark .visual .vf{color:#c3d4ee; background:rgba(20,32,56,.6); border-color:rgba(140,170,220,.4);}
  @media (max-height:780px){
    .visual{margin-top:9px; gap:9px;}
    .visual .vic{width:47px; height:47px; border-radius:13px;}
    .visual .vic svg{width:36px; height:36px;}
    .visual .vf{font-size:14.5px; padding:4px 11px;}
  }
  @media (max-height:640px){
    .visual .vic{width:40px; height:40px;}
    .visual .vic svg{width:31px; height:31px;}
    .visual .vf{font-size:13.5px;}
  }
  /* ---------- icons & motion ---------- */
  .tabic{width:28px; height:28px; border-radius:9px; display:block; margin:0 auto; transition:transform .25s cubic-bezier(.2,.9,.3,1.4);}
  .tab{transition:transform .15s;}
  .tab:active{transform:scale(.92);}
  .tab.active .tabic{transform:scale(1.14);}
  .btnic{width:23px; height:23px; border-radius:7px; vertical-align:-6px; margin-right:7px;}
  #btnNext .btnic{margin-right:0; margin-left:7px;}
  .backic{width:26px; height:26px; border-radius:8px; display:block;}
  .back{display:inline-flex; align-items:center; justify-content:center; padding:5px;}
  .spkic{width:21px; height:21px; border-radius:6px;}
  .mascot{width:76px; height:76px; border-radius:22px; flex:0 0 auto; box-shadow:0 8px 20px rgba(50,70,110,.25);
    animation:bob 3.4s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg);} 50%{transform:translateY(-7px) rotate(2.5deg);}}
  .subjic{width:42px; height:42px; border-radius:12px; float:right; margin-left:10px;}
  .view.active{animation:viewIn .38s cubic-bezier(.2,.9,.25,1.15);}
  @keyframes viewIn{from{opacity:0; transform:translateY(14px);}}
  .cta{box-shadow:0 5px 0 rgba(146,79,8,.55), 0 16px 30px rgba(217,119,6,.35); transition:transform .1s, box-shadow .1s;}
  .cta:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(146,79,8,.55), 0 8px 16px rgba(217,119,6,.3);}
  .opt,.fchip,.lang-chip,.set-chip,.choice,.witem,.chap-row,.subj,.btn{transition:transform .12s ease, background .15s, box-shadow .15s;}
  .opt:active,.fchip:active,.lang-chip:active,.set-chip:active,.witem:active,.chap-row:active,.subj:active,.btn:active{transform:scale(.965);}
  .card.pop{animation:cardPop .38s cubic-bezier(.2,.9,.3,1.3);}
  @keyframes cardPop{from{transform:scale(.93) translateY(10px); opacity:.4;}}
  .choice{animation:choiceIn .32s cubic-bezier(.2,.9,.3,1.2) both;}
  @keyframes choiceIn{from{opacity:0; transform:translateY(10px) scale(.98);}}
  .choice.right{animation:pulse .5s ease;}
  @keyframes pulse{35%{transform:scale(1.035);}}
  .choice.wrong{animation:shake .42s ease;}
  @keyframes shake{15%,55%{transform:translateX(-6px);} 35%,75%{transform:translateX(6px);}}
  .bar i{animation:barIn .8s cubic-bezier(.2,.8,.2,1) both; transform-origin:left center;}
  @keyframes barIn{from{transform:scaleX(0);}}
  #ringFg{transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1);}
  #confetti{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:60;}
  .confetti-piece{position:absolute; top:-4vh; border-radius:2px; animation-name:confFall; animation-timing-function:linear; animation-fill-mode:forwards;}
  @keyframes confFall{to{transform:translateY(108vh) rotate(680deg);}}
  body.noanim *, body.noanim *::before, body.noanim *::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important;}
  @media (max-width:430px){ .mascot{width:58px; height:58px; border-radius:17px;} .hero{flex-wrap:wrap; row-gap:10px;} }
  .kbd-hint{display:none;}
  @media (min-width:900px) and (pointer:fine){
    .kbd-hint{display:block; color:var(--faint); font-size:12px; text-align:center; margin-top:8px;}
    kbd{background:var(--glass2); border:1px solid var(--line); border-bottom-width:2px; border-radius:6px; padding:1px 6px; font-family:inherit;}
  }
</style>
</head>
<body>
<div id="confetti"></div>
<div class="app">
  <div class="appbar">

    <div>

  <div class="views">

            <stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#2563eb"/>
          </linearGradient></defs>

          <circle class="val" id="ringVal" cx="42" cy="42" r="36" stroke-dasharray="226.2" stroke-dashoffset="226.2"></circle>
          <text x="42" y="49" id="ringPct">0%</text>

        <button class="btn navb" id="btnFlip"><img class="btnic" data-icon="flip" alt=""><span id="lblFlip"></span></button>
        <button class="btn navb" id="btnNext"><span id="lblNext"></span><img class="btnic" data-icon="next" alt=""></button>
      </div>
      <p class="kbd-hint" id="kbdHint"></p>
    </section>

    <section class="view" id="view-book">
      <h2 class="sec" id="bookTitle">マイ単語帳</h2>
      <p class="sec-sub" id="bookSub"></p>
      <div class="filter-row" id="bookFilters">
        <button class="fchip active" data-f="all"></button>
        <button class="fchip" data-f="ok"></button>
        <button class="fchip" data-f="ng"></button>
      </div>
      <div id="bookList"></div>
    </section>

    <section class="view" id="view-search">

      <p class="sec-sub" id="searchSub"></p>
      <input class="searchbox" id="searchInput" type="search" autocomplete="off">
      <div id="searchList" style="margin-top:14px;"></div>
    </section>

    <section class="view" id="view-test">
      <div class="study-head">
        <button class="back" id="btnTestBack"><img class="backic" data-icon="back" alt=""></button>

      </div>

        <div class="grp" id="tChLbl"></div>
        <div class="filter-row" id="tChRow"></div>
        <div class="grp" id="tFmtLbl"></div>
        <div class="filter-row">
          <button class="fchip active" data-tfmt="choice" id="tFmtChoice"></button>
          <button class="fchip" data-tfmt="type" id="tFmtType"></button>
        </div>

          <button class="fchip active" data-tdir="en2nat" id="tDirA"></button>
          <button class="fchip" data-tdir="nat2en" id="tDirB"></button>

        <p class="sec-sub" id="tCntInfo"></p>
        <button class="cta" id="btnStartTest"><img class="btnic" data-icon="play" alt=""><span id="lblStartTest"></span></button>
        <p class="sec-sub" id="tKnownNote" style="margin-top:10px;"></p>
      </div>

        <div class="study-head">
          <span class="ttl" id="qProg">1 / 10</span>
          <span class="cnt" id="qScore"></span>

        <div class="qcard">
          <div class="qprompt" id="qPrompt">—</div>

        <div id="qTypeWrap" style="display:none">
          <input class="searchbox" id="qInput" type="text" autocomplete="off">
          <button class="cta" id="btnCheck" style="margin-top:10px;"></button>
        </div>
        <div class="qfeedback" id="qFeedback"></div>
        <div class="qvis" id="qVisFb" style="display:none">
          <img id="qVisImg" alt="">
          <div class="qvis-scrim" id="qVisFormula"></div>
        </div>
        <button class="cta" id="btnQNext" style="display:none"></button>
      </div>
      <div id="testResult" style="display:none">
        <div class="hero" style="flex-direction:column; text-align:center; align-items:center; gap:6px;">
          <img class="mascot" data-icon="trophy" alt="">
          <div class="score-big" id="rScore">0 / 10</div>
          <div class="big" id="rPct">0%</div>
          <div class="small" id="rMsg"></div>
        </div>
        <button class="cta" id="btnAgain" style="margin-top:14px;"><img class="btnic" data-icon="retry" alt=""><span id="lblAgain"></span></button>
        <div class="opt-row" style="margin-top:10px;">
          <button class="opt" id="btnResultProg"><img class="btnic" data-icon="chart" alt=""><span id="lblResultProg"></span></button>
          <button class="opt" id="btnResultSubj"><img class="btnic" data-icon="book" alt=""><span id="lblResultSubj"></span></button>

            <button class="lang-chip" data-lang="zh">简体中文</button>
            <button class="lang-chip" data-lang="tw">繁體中文</button>

  <div class="modal-card">

</div>

<script>
/* ================= i18n ================= */
const LANGS = {
ja:{appTitle:"英語で学ぶ理系",totalWords:"収録",totalKnown:"覚えた",unit:"語",lang:"言語",

 badgeStudy:"学習中",badgeSoon:"準備中",subjDescReady:"Ch.1–4 ・ 58語",subjDescSoon:"用語集を準備中",
 knownOf:(k,t)=>k+" / "+t+" 語 覚えた",

 subjectsTitle:"物理 — 単元を選ぶ",

/* ================= app logic ================= */
const $ = id => document.getElementById(id);
const LS_KEY = "physics-english-cards-v1";
const LS_LANG = "stem-english-lang";
/* Safe storage: some in-app viewers block localStorage; fall back to memory so the app never dies. */
const store = {
  _m: {},
  get: function(k){ try{ return localStorage.getItem(k); }catch(e){ return (k in this._m) ? this._m[k] : null; } },
  set: function(k, v){ try{ localStorage.setItem(k, v); }catch(e){ this._m[k] = v; } }
};
let lang = store.get(LS_LANG) || "ja";
if(!LANGS[lang]) lang = "ja";
const L = () => LANGS[lang];
const tr = t => t[lang];
const nt = t => lang==="en" ? EN_NOTES[TERMS.indexOf(t)] : t["n"+lang];
let known = new Set(JSON.parse(store.get(LS_KEY) || "[]"));
let optShuffle = false, optUnknown = false;
let session = [], sPos = 0, sCh = "all", flipped = false;
let bookFilter = "all";

function save(){ store.set(LS_KEY, JSON.stringify([...known])); }
function chCount(ch){ return TERMS.filter(t=>t.ch===ch).length; }
function chKnown(ch){ return TERMS.filter((t,i)=>t.ch===ch && known.has(i)).length; }

function applyStatic(){
  const l = L();
  document.documentElement.lang = ({ja:"ja",ko:"ko",zh:"zh-CN",tw:"zh-TW",en:"en"})[lang];
  $("appTitle").textContent = l.appTitle;
  $("totalWordsLbl").textContent = l.totalWords;
  $("totalKnownLbl").textContent = l.totalKnown;
  $("unitWords").textContent = l.unit; $("unitWords2").textContent = l.unit;
  $("langLbl").textContent = l.lang;
  $("lblStart").textContent = l.cta;
  $("secSubjects").textContent = l.secSubjects;
  $("secSubjectsSub").textContent = l.secSubjectsSub;
  $("subjectsTitle").textContent = l.subjectsTitle;
  $("subjectsSub").textContent = l.subjectsSub;
  $("tapHint").textContent = l.tapHint;
  $("lblBad").textContent = l.still; $("lblGood").textContent = l.got;
  $("lblPrev").textContent = l.prev; $("lblFlip").textContent = l.flip; $("lblNext").textContent = l.next;
  $("doneBig").textContent = l.doneBig; $("doneSub").textContent = l.doneSub;
  $("bookTitle").textContent = l.bookTitle; $("bookSub").textContent = l.bookSub;
  const fc = document.querySelectorAll("#bookFilters .fchip");
  fc[0].textContent = l.fAll; fc[1].textContent = l.fOk; fc[2].textContent = l.fNg;
  $("searchTitle").textContent = l.searchTitle; $("searchSub").textContent = l.searchSub;
  $("searchInput").placeholder = l.searchPh;
  document.querySelectorAll(".tab [data-tab]").forEach((el,i)=>{ el.textContent = l.tabs[i]; });
  $("kbdHint").innerHTML = l.kbd;
  applySettingsText(); applyTestText();
  document.querySelectorAll(".lang-chip").forEach(c=>c.classList.toggle("active", c.dataset.lang===lang));
}
document.querySelectorAll(".lang-chip").forEach(c=>c.addEventListener("click", ()=>{
  lang = c.dataset.lang; store.set(LS_LANG, lang);
  applyStatic(); renderHome(); renderSubjects(); renderBook(); renderSearch();
  if($("view-study").classList.contains("active")) renderCard();
}));

/* ---------- navigation ---------- */
function show(view){
  if(typeof quizRunning === "function" && quizRunning()){ askQuitQuiz(()=>show(view)); return; }
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  $("view-"+view).classList.add("active");
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active", t.dataset.view===view));
  if(view==="home") renderHome();
  if(view==="subjects") renderSubjects();
  if(view==="book") renderBook();
  if(view==="search") renderSearch();
  if(view==="settings") renderSettings();
  if(view==="test") renderTestSetup();
  if(view==="progress") renderProgress();
}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click", ()=>{ se("tap"); show(t.dataset.view); }));
$("btnStart").addEventListener("click", ()=>{ se("start"); show("subjects"); });
$("btnBack").addEventListener("click", ()=>show("subjects"));

/* ---------- home ---------- */
function renderHome(){

/* ---------- study ---------- */
function buildSession(ch, startIdx){
  let idxs = TERMS.map((t,i)=>i).filter(i => ch==="all" || TERMS[i].ch===Number(ch));
  if(optUnknown) idxs = idxs.filter(i=>!known.has(i));
  if(optShuffle) for(let i=idxs.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [idxs[i],idxs[j]]=[idxs[j],idxs[i]]; }
  if(startIdx!=null){
    const p = idxs.indexOf(startIdx);
    if(p>=0) idxs = idxs.slice(p).concat(idxs.slice(0,p));
    else idxs = [startIdx].concat(idxs);
  }
  return idxs;
}
let celebrated = false;
function startStudy(ch, startIdx){
  celebrated = false;
  sCh = ch; session = buildSession(ch, startIdx); sPos = 0; flipped = false;
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  $("view-study").classList.add("active");
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active", t.dataset.view==="subjects"));
  renderCard();
}
function renderCard(){
  const l = L(), has = session.length>0;
  $("card").style.display = has? "block":"none";
  $("doneMsg").style.display = has? "none":"block";
  document.querySelector(".actions").style.visibility = has? "visible":"hidden";
  document.querySelector(".navrow").style.visibility = has? "visible":"hidden";
  $("studyTitle").textContent = sCh==="all" ? l.studyAll : l.chNames[Number(sCh)];
  if(!has){ $("studyCnt").textContent = "0 / 0"; if(!celebrated){ celebrated = true; se("finish"); spawnConfetti(); } return; }
  const cardEl = $("card"); cardEl.classList.remove("pop"); void cardEl.offsetWidth; cardEl.classList.add("pop");
  if(sPos >= session.length) sPos = 0;
  const gi = session[sPos], t = TERMS[gi];
  $("chTag").textContent = l.chNames[t.ch];
  $("termEn").textContent = t.en;
  $("termIpa").textContent = IPAS[gi] || "";
  const bgEl = $("backBg");
  bgEl.style.display = "block"; bgEl.src = visSrc(gi);
  $("backVisual").innerHTML = formulaHTML(gi);
  if(session.length > 1){ const pre = new Image(); pre.src = visSrc(session[(sPos+1) % session.length]); }
  if(settings.autoSpeak) speak(t.en);
  $("termTr").textContent = tr(t);
  $("termNote").textContent = nt(t);
  $("termEn2").textContent = t.en;
  $("knownBadge").textContent = known.has(gi) ? l.knownBadge : "";
  $("card").classList.toggle("flipped", flipped);
  $("studyCnt").textContent = (sPos+1) + " / " + session.length;
}
function flip(){ if(session.length){ se("flip"); flipped=!flipped; renderCard(); } }
function next(d){ if(!session.length) return; sPos=(sPos+d+session.length)%session.length; flipped=false; renderCard(); }
function mark(val){
  if(!session.length) return;
  se(val ? "good" : "bad");
  const gi = session[sPos];
  if(val) known.add(gi); else known.delete(gi);
  save(); flipped = false;
  if(!settings.autoNext && !(optUnknown && val)){ renderCard(); return; }
  if(optUnknown && val){
    session = session.filter(i=>i!==gi);
    if(sPos >= session.length) sPos = Math.max(0, session.length-1);
  } else if(sPos < session.length-1) sPos++;
  renderCard();
}
$("card").addEventListener("click", flip);
$("btnFlip").addEventListener("click", flip);
$("btnNext").addEventListener("click", ()=>next(1));
$("btnPrev").addEventListener("click", ()=>next(-1));
$("btnGood").addEventListener("click", ()=>mark(true));
$("btnBad").addEventListener("click", ()=>mark(false));
let tx = null;
$("scene").addEventListener("touchstart", e=>{ tx=e.changedTouches[0].clientX; }, {passive:true});
$("scene").addEventListener("touchend", e=>{
  if(tx===null) return; const dx = e.changedTouches[0].clientX - tx; tx=null;
  if(Math.abs(dx) > 56) next(dx<0?1:-1);
}, {passive:true});
document.addEventListener("keydown", e=>{
  if(!$("view-study").classList.contains("active")) return;
  if(e.key==="ArrowRight") next(1);
  else if(e.key==="ArrowLeft") next(-1);
  else if(e.key===" "){ e.preventDefault(); flip(); }
  else if(e.key==="1") mark(false);
  else if(e.key==="2") mark(true);
});

/* ---------- wordbook ---------- */
function itemHTML(i){
  const l = L(), t = TERMS[i], ok = known.has(i);
  return '<button class="witem" data-i="'+i+'"><span><span class="en">'+t.en+'</span><span class="wipa">'+(IPAS[i]||"")+'</span><div class="jp2">'+tr(t)+' ・ '+l.chNames[t.ch]+'</div></span>'
    + '<span class="st '+(ok?"ok":"ng")+'" data-toggle="'+i+'">'+(ok?l.stOk:l.stNg)+'</span></button>';
}
function bindItems(root){
  root.querySelectorAll(".witem").forEach(b=>{
    b.addEventListener("click", e=>{
      const tg = e.target.closest("[data-toggle]");
      const i = Number(b.dataset.i);
      if(tg){ e.stopPropagation();
        if(known.has(i)) known.delete(i); else known.add(i);
        save(); renderBook(); renderSearch(); return;
      }
      startStudy(String(TERMS[i].ch), i);
    });
  });
}
function renderBook(){
  const l = L();
  document.querySelectorAll("#bookFilters .fchip").forEach(c=>c.classList.toggle("active", c.dataset.f===bookFilter));
  let html = "", lastCh = 0;
  TERMS.forEach((t,i)=>{
    if(bookFilter==="ok" && !known.has(i)) return;
    if(bookFilter==="ng" && known.has(i)) return;
    if(t.ch!==lastCh){ html += '<div class="grp">'+l.chNames[t.ch]+'</div>'; lastCh = t.ch; }
    html += itemHTML(i);
  });
  $("bookList").innerHTML = html || '<div class="empty">'+l.bookEmpty+'</div>';
  bindItems($("bookList"));
}
$("bookFilters").addEventListener("click", e=>{
  const b = e.target.closest(".fchip"); if(!b) return;
  bookFilter = b.dataset.f; renderBook();
});

/* ---------- search ---------- */
function renderSearch(){
  const l = L(), q = $("searchInput").value.trim().toLowerCase();
  if(!q){ $("searchList").innerHTML = '<div class="empty">'+l.searchEmpty+'</div>'; return; }
  const hits = TERMS.map((t,i)=>i).filter(i=>{
    const t = TERMS[i];
    return [t.en,t.ja,t.ko,t.zh,t.tw,t.nja,t.nko,t.nzh,t.ntw,EN_NOTES[i]].some(s=>s.toLowerCase().includes(q));
  });
  $("searchList").innerHTML = hits.length
    ? hits.map(itemHTML).join("")
    : '<div class="empty">'+l.searchNone($("searchInput").value.trim())+'</div>';
  bindItems($("searchList"));
}
$("searchInput").addEventListener("input", renderSearch);

function poolIdx(ch){ return TERMS.map((t,i)=>i).filter(i => ch==="all" || TERMS[i].ch===Number(ch)); }
function shuffled(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function sideText(i, side){
  if(side==="en") return TERMS[i].en;
  return lang==="en" ? EN_NOTES[i] : tr(TERMS[i]);
}

  document.querySelectorAll("[data-tfmt]").forEach(b=>b.classList.toggle("active", b.dataset.tfmt===tFmt));

  const pool = poolIdx(tCh).length;
  const n = settings.qcount>0 ? Math.min(settings.qcount, pool) : pool;
  $("tCntInfo").textContent = t.cntInfo(pool, n);
  $("lblStartTest").textContent = t.start;
  $("tKnownNote").textContent = "";

function buildQuiz(){
  const idxs = shuffled(poolIdx(tCh));
  const n = settings.qcount>0 ? Math.min(settings.qcount, idxs.length) : idxs.length;
  const picked = idxs.slice(0, n);
  return picked.map(gi=>{
    let pSide = tDir==="en2nat" ? "en" : "nat";
    let aSide = tDir==="en2nat" ? "nat" : "en";
    if(lang==="en" && aSide==="nat"){ const tmp=pSide; pSide=aSide; aSide=tmp; }
    let choices = null;
    if(tFmt==="choice"){
      const sameCh = shuffled(TERMS.map((t,i)=>i).filter(i=>i!==gi && TERMS[i].ch===TERMS[gi].ch));
      const rest = shuffled(TERMS.map((t,i)=>i).filter(i=>i!==gi && TERMS[i].ch!==TERMS[gi].ch));
      choices = shuffled([gi].concat(sameCh.concat(rest).slice(0,3)));
    }
    return {gi, pSide, aSide, choices};
  });
}

  se("start");
  const list = buildQuiz();

  quiz = {list, pos:0, score:0, locked:false, knownSnap:new Set(known)};
  $("testSetup").style.display = "none";
  $("testResult").style.display = "none";
  $("testRun").style.display = "block";
  renderQ();
}

    $("qSpkBtn").style.display = "inline-flex";
    $("qIpa").textContent = IPAS[q.gi] || "";
    if(settings.autoSpeak) speak(TERMS[q.gi].en);
  } else {
    $("qSpkBtn").style.display = "none";
  }
  $("qVisFb").style.display = "none";
  $("qHint").textContent = L().chNames[TERMS[q.gi].ch];
  $("qFeedback").textContent = ""; $("qFeedback").className = "qfeedback";
  $("btnQNext").style.display = "none";
  if(tFmt==="choice"){
    $("qChoices").style.display = "block"; $("qTypeWrap").style.display = "none";
    $("qChoices").innerHTML = q.choices.map((ci,ix)=>'<button class="choice" style="animation-delay:'+(ix*55)+'ms" data-ci="'+ci+'">'+sideText(ci, q.aSide)+'</button>').join("");
    document.querySelectorAll(".choice").forEach(b=>b.addEventListener("click", ()=>answerChoice(Number(b.dataset.ci), b)));
  } else {
    $("qChoices").style.display = "none"; $("qTypeWrap").style.display = "block";
    $("qInput").value = ""; $("qInput").placeholder = t.typePh;
    $("btnCheck").textContent = t.check;
    setTimeout(()=>$("qInput").focus(), 60);
  }
}
function finishAnswer(ok, correctText){
  const t = T();
  se(ok ? "good" : "bad");
  quiz.locked = true;
  const q = quiz.list[quiz.pos];
  if(ok){ quiz.score++; if(!known.has(q.gi)){ known.add(q.gi); save(); } }
  $("qFeedback").textContent = ok ? t.correct : (t.wrong + " — " + t.ansIs(correctText));
  $("qFeedback").className = "qfeedback " + (ok ? "ok" : "ng");
  const qim = $("qVisImg");
  qim.style.display = "block"; qim.src = visSrc(q.gi);
  $("qVisFormula").innerHTML = formulaHTML(q.gi);
  $("qVisFb").style.display = "block";
  $("qScore").textContent = t.score(quiz.score, quiz.list.length);
  const last = quiz.pos >= quiz.list.length - 1;
  $("btnQNext").textContent = last ? t.finish : t.next;
  $("btnQNext").style.display = "block";
}
function answerChoice(ci, btn){
  if(quiz.locked) return;
  const q = quiz.list[quiz.pos];
  document.querySelectorAll(".choice").forEach(b=>{
    b.disabled = true;
    if(Number(b.dataset.ci)===q.gi) b.classList.add("right");
  });
  if(ci!==q.gi) btn.classList.add("wrong");
  finishAnswer(ci===q.gi, sideText(q.gi, q.aSide));
}
function normText(s){
  return (s||"").toLowerCase().replace(/[\s　]+/g," ")
    .replace(/[（）()、，,;；:：・。.!！?？「」""]/g,"").trim();
}
function typeOK(input, answer){
  const ni = normText(input), na = normText(answer);
  if(!ni) return false;
  if(ni===na || ni.replace(/ /g,"")===na.replace(/ /g,"")) return true;
  if(answer.includes("/") || answer.includes("／")){
    const parts = answer.split(/[/／]/).map(normText).filter(Boolean);
    return parts.length>0 && parts.every(p=>ni.includes(p));
  }
  const parts = answer.split(/[（）()]/).map(normText).filter(Boolean);
  return parts.some(p=>p===ni);
}
function checkType(){
  if(!quiz || quiz.locked) return;
  const q = quiz.list[quiz.pos];
  const ans = sideText(q.gi, q.aSide);
  finishAnswer(typeOK($("qInput").value, ans), ans);
}
$("btnCheck").addEventListener("click", checkType);
$("qInput").addEventListener("keydown", e=>{
  if(e.key==="Enter"){ if(quiz && quiz.locked) nextQ(); else checkType(); }
});
$("btnQNext").addEventListener("click", ()=>nextQ());
function nextQ(){
  if(!quiz) return;
  if(quiz.pos >= quiz.list.length - 1){ showResult(); return; }
  quiz.pos++; renderQ();
}
/* ---------- quit guard: a test in progress cannot be left silently ---------- */
let pendingNav = null;
function quizRunning(){ return !!quiz && $("testRun").style.display !== "none"; }
function askQuitQuiz(next){

function closeQuitModal(){ $("quitModal").style.display = "none"; pendingNav = null; }
function discardQuiz(){
  if(quiz && quiz.knownSnap){ known.clear(); quiz.knownSnap.forEach(i=>known.add(i)); save(); }
  quiz = null;
}
$("qmStay").addEventListener("click", closeQuitModal);
$("qmLeave").addEventListener("click", ()=>{

$("quitModal").addEventListener("click", e=>{ if(e.target === $("quitModal")) closeQuitModal(); });
window.addEventListener("beforeunload", e=>{ if(quizRunning()){ e.preventDefault(); e.returnValue = ""; } });

function showResult(){
  const t = T();
  const total = quiz.list.length, c = quiz.score;
  const pct = total? Math.round(c/total*100) : 0;
  testLog.push({ts:Date.now(), ch:tCh, fmt:tFmt, dir:tDir, total, correct:c});
  store.set(LS_LOG, JSON.stringify(testLog));
  $("testRun").style.display = "none";
  $("testResult").style.display = "block";
  $("rScore").textContent = c + " / " + total;
  $("rPct").textContent = pct + "%";
  $("rMsg").textContent = pct>=100 ? t.msgPerfect : pct>=80 ? t.msgGood : pct>=50 ? t.msgOk : t.msgTry;
  $("lblAgain").textContent = t.again;
  $("lblResultProg").textContent = t.progBtn;
  $("lblResultSubj").textContent = t.toSubjects;
  se(pct>=50 ? "finish" : "tap");
  if(pct>=80) spawnConfetti();

function renderProgress(){
  const t = T(), l = L();
  $("progTitle").textContent = t.progTitle;

  $("progChapters").innerHTML = rows.map(r=>{
    const tot = r.ch==="all" ? TERMS.length : chCount(r.ch);
    const kn  = r.ch==="all" ? known.size : chKnown(r.ch);
    const p = tot? Math.round(kn/tot*100):0;
    return '<div class="chap-row" style="cursor:default"><span><span class="nm">'+r.nm+'</span><div class="ds">'+l.knownLine(kn,tot)+' ・ '+p+'%</div>'
      + '<div class="bar"><i style="width:'+p+'%"></i></div></span></div>';
  }).join("");
  $("stAttemptsK").textContent = t.attempts;
  $("stAvgK").textContent = t.avg;
  $("stBestK").textContent = t.best;
  $("stAttempts").textContent = testLog.length;
  if(testLog.length){
    const pcts = testLog.map(x=>x.total? x.correct/x.total*100 : 0);
    $("stAvg").textContent = Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length) + "%";
    $("stBest").textContent = Math.round(Math.max.apply(null, pcts)) + "%";
    const locale = ({ja:"ja-JP",ko:"ko-KR",zh:"zh-CN",tw:"zh-TW",en:"en-US"})[lang];
    $("progRecent").innerHTML = testLog.slice(-5).reverse().map(x=>{
      const d = new Date(x.ts).toLocaleDateString(locale);
      const chName = x.ch==="all" ? l.studyAll : l.chNames[Number(x.ch)];
      const fmt = x.fmt==="choice" ? t.fmtChoice : t.fmtType;
      const p = x.total? Math.round(x.correct/x.total*100):0;
      return '<div class="log-row"><span>'+chName+' ・ '+fmt+'</span><span class="dt">'+d+'</span><span class="sc">'+x.correct+' / '+x.total+' ('+p+'%)</span></div>';
    }).join("");
  } else {
    $("stAvg").textContent = "–"; $("stBest").textContent = "–";
    $("progRecent").innerHTML = '<div class="empty">'+t.noTest+'</div>';
  }
}

/* ================= sound & effects ================= */
let AC = null;
function ac(){
  if(!AC){ try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ AC = null; } }
  if(AC && AC.state === "suspended") AC.resume();
  return AC;
}
function tone(f, delay, dur, type, vol, slideTo){
  if(!AC) return;
  const t0 = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || "sine";
  o.frequency.setValueAtTime(f, t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.05, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function se(name){
  if(!settings.se) return;
  if(!ac()) return;
  if(name==="tap") tone(640, 0, 0.06, "sine", 0.03);
  else if(name==="flip") tone(300, 0, 0.1, "sine", 0.035, 560);
  else if(name==="good") [523.25, 659.25, 783.99].forEach((f,i)=>tone(f, i*0.07, 0.14, "triangle", 0.045));
  else if(name==="bad") tone(196, 0, 0.16, "sine", 0.04, 165);
  else if(name==="start"){ tone(392, 0, 0.08, "triangle", 0.045); tone(587.33, 0.07, 0.12, "triangle", 0.045); }
  else if(name==="finish") [523.25, 659.25, 783.99, 1046.5].forEach((f,i)=>tone(f, i*0.08, 0.16, "triangle", 0.045));
}
function spawnConfetti(){
  const box = $("confetti"); if(!box) return;
  const colors = ["#f59e0b","#3b82c4","#7fb2e5","#e8a33d","#5b84ae","#f2c879"];
  for(let i=0;i<44;i++){
    const d = document.createElement("div");
    d.className = "confetti-piece";
    const sz = 5 + Math.random()*6;
    d.style.left = (Math.random()*100) + "vw";
    d.style.width = sz + "px";
    d.style.height = (sz*0.55) + "px";
    d.style.background = colors[i % colors.length];
    d.style.animationDuration = (1.7 + Math.random()*1.4) + "s";
    d.style.animationDelay = (Math.random()*0.35) + "s";
    box.appendChild(d);
    setTimeout(()=>d.remove(), 3800);
  }
}
